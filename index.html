<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Base Background with Nature Gradient */
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(180deg, #eafaf1 0%, #d4edda 50%, #c3e6cb 100%);
            font-family: system-ui, -apple-system, sans-serif;
            color: #1c1c1e;
            padding-bottom: 80px;
            overflow-x: hidden;
            position: relative;
        }

        /* Swaying Cartoon Trees Background Visuals */
        .tree-bg-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            pointer-events: none;
            z-index: 0;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 10px;
            opacity: 0.7;
        }

        .tree {
            transform-origin: bottom center;
            animation: swayTree 6s ease-in-out infinite alternate;
        }

        .tree-left {
            animation-delay: 0s;
        }

        .tree-right {
            animation-delay: -3s;
        }

        @keyframes swayTree {
            0% { transform: rotate(-3deg) scale(1); }
            100% { transform: rotate(4deg) scale(1.02); }
        }

        /* Glassmorphism Navigation Bar */
        .navbar-ios {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(46, 125, 50, 0.15);
            z-index: 1000;
        }
        .navbar-brand {
            font-weight: 700;
            color: #1b5e20;
        }

        /* Elevated Floating Block / Green-White Blended Card */
        .ios-card {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(220, 245, 230, 0.85) 100%);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 20px 40px rgba(46, 125, 50, 0.15), 0 8px 16px rgba(0, 0, 0, 0.04);
            padding: 30px;
            margin-top: 90px;
            animation: floatBlock 5s ease-in-out infinite;
        }

        /* Floating Bobbing Animation for Main Block */
        @keyframes floatBlock {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Developer Telegram Link Styling */
        .dev-tg-link {
            display: inline-block;
            padding: 8px 16px;
            background: rgba(46, 125, 50, 0.08);
            border: 1px solid rgba(46, 125, 50, 0.25);
            border-radius: 30px;
            color: #2e7d32;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        .dev-tg-link:hover {
            background: #2e7d32;
            color: #ffffff;
            box-shadow: 0 0 15px rgba(46, 125, 50, 0.5);
            transform: translateY(-2px);
        }

        .form-control-ios, .form-select-ios {
            border-radius: 14px;
            border: 1px solid #c8e6c9;
            padding: 14px 16px;
            font-size: 15px;
            background-color: rgba(255, 255, 255, 0.9);
            color: #000000;
            transition: all 0.3s ease;
        }
        .form-control-ios:focus, .form-select-ios:focus {
            border-color: #4caf50;
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.3);
            outline: none;
            background-color: #ffffff;
        }

        /* Glowing Smooth Start Download Button */
        .btn-ios-primary {
            background: linear-gradient(135deg, #2e7d32 0%, #4caf50 100%);
            color: #ffffff;
            border-radius: 16px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            width: 100%;
            box-shadow: 0 8px 20px rgba(46, 125, 50, 0.3);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        .btn-ios-primary:hover {
            background: linear-gradient(135deg, #1b5e20 0%, #388e3c 100%);
            box-shadow: 0 12px 25px rgba(46, 125, 50, 0.4), 0 0 15px rgba(76, 175, 80, 0.6);
            transform: translateY(-2px);
            color: #ffffff;
        }
        .btn-ios-primary:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 0 25px rgba(76, 175, 80, 0.9), 0 0 10px #81c784;
        }

        /* File List Container Blocks (Green-White Gradient + Floating) */
        .list-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-top: 35px;
            margin-bottom: 15px;
            color: #1b5e20;
        }
        .ios-list-group {
            position: relative;
            z-index: 10;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(220, 245, 230, 0.85) 100%);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(46, 125, 50, 0.12), 0 5px 15px rgba(0, 0, 0, 0.04);
            animation: floatBlock 6s ease-in-out infinite alternate;
        }

        /* Motion Slide In for MP3 / MP4 Items */
        .ios-list-item {
            padding: 20px;
            border-bottom: 1px solid rgba(46, 125, 50, 0.08);
            display: flex;
            flex-direction: column;
            gap: 12px;
            animation: slideInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .ios-list-item:last-child { border-bottom: none; }

        @keyframes slideInUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        audio { width: 100%; height: 40px; border-radius: 10px; }
        video { width: 100%; max-height: 250px; border-radius: 14px; background-color: #000; }

        /* =========================================================
           CUSTOM COMPACT SAVED BUTTON CSS STYLES (သေးငယ်အောင် ပြင်ထားသည်)
           ========================================================= */
        .fx-layer { filter: contrast(3); }

        .box {
            --w: 105px;  /* အနည်းငယ် သေးငယ်အောင် ပြင်ထားသည် */
            --h: 38px;
            --r: 9999px;
            --tr: 20%;
            z-index: 500;
            position: relative;
            width: var(--w);
            height: var(--h);
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: var(--r);
            border: 1px double rgba(51, 51, 51, 0.08);

            box-shadow:
                inset 2px -2px 1px -1px rgba(255, 255, 255, 0.9),
                inset -2px 2px 1px -1px rgba(255, 255, 255, 0.9),
                inset 6px -6px 1px -6px rgba(255, 255, 255, 0.55),
                inset -6px 6px 1px -6px rgba(255, 255, 255, 0.55),
                inset 0 0 2px rgba(0, 0, 0, 0.8),
                0 4px 8px rgba(0, 0, 0, 0.15);

            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            cursor: pointer;
            filter: brightness(0.95);
            user-select: none;
            text-decoration: none !important;
            transition: all 0.25s ease;
        }

        .box .svg {
            width: 20px;
            filter: drop-shadow(0 25px 3px rgba(102, 102, 102, 0.2));
        }

        .box:before {
            content: "";
            position: absolute;
            z-index: 1;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: calc(var(--w) - 12px);
            height: calc(var(--h) - 12px);
            border-radius: var(--r);
            border: 1px solid rgba(0, 0, 0, 0.9);
            filter: blur(6px);
        }

        .box:after {
            z-index: 501;
            content: "";
            position: absolute;
            width: var(--w);
            height: var(--h);
            border-radius: var(--r);
            filter: blur(5px);
            background: linear-gradient(
                45deg,
                rgba(255, 255, 255, 0.8) 0%,
                transparent var(--tr),
                transparent calc(100% - var(--tr)),
                rgba(255, 255, 255, 0.8) 100%
            );
        }

        .box .circle-overlay {
            position: absolute;
            width: calc(var(--w) - 6px);
            height: calc(var(--h) - 6px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: var(--r);
            filter: blur(1px);
        }

        .start-btn {
            padding: 0 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: 0.25s;
        }

        .start-btn .text {
            font-size: 13px;
            font-family: system-ui, -apple-system, sans-serif;
            color: #2e7d32;
            font-weight: 700;
        }

        .start-btn .btn-icon {
            width: 26px;
            height: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2e7d32;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(46, 125, 50, 0.4);
            transition: 0.25s;
        }

        .start-btn .btn-icon .svg {
            width: 11px;
            fill: #ffffff;
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 12px rgba(76, 175, 80, 0.6);
        }

        .start-btn:hover .btn-icon {
            transform: scale(1.1);
            background: #1b5e20;
        }

        .start-btn:active {
            transform: scale(0.94);
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.9);
        }

        /* Loading Spinner Animation */
        .loading-pulse {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Swaying Cartoon Trees Visual Background -->
    <div class="tree-bg-container">
        <!-- Cartoon Tree Left -->
        <svg class="tree tree-left" width="120" height="180" viewBox="0 0 100 150">
            <rect x="42" y="90" width="16" height="60" fill="#795548" rx="4" />
            <path d="M50 10 C20 40 10 70 25 95 C40 115 60 115 75 95 C90 70 80 40 50 10 Z" fill="#4caf50" />
            <path d="M50 25 C30 50 25 70 35 90 C50 105 65 95 70 80 C75 60 65 45 50 25 Z" fill="#81c784" />
        </svg>

        <!-- Cartoon Tree Right -->
        <svg class="tree tree-right" width="140" height="200" viewBox="0 0 100 150">
            <rect x="44" y="85" width="12" height="65" fill="#5d4037" rx="3" />
            <circle cx="50" cy="55" r="45" fill="#388e3c" />
            <circle cx="35" cy="45" r="30" fill="#4caf50" />
            <circle cx="65" cy="50" r="25" fill="#81c784" />
        </svg>
    </div>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-ios fixed-top">
        <div class="container">
            <a class="navbar-brand" href="#">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-cloud-arrow-down-fill me-2" viewBox="0 0 16 16">
                  <path d="M8 2a5.53 5.53 0 0 0-3.594 1.342c-.766.66-1.321 1.52-1.464 2.383C1.266 6.095 0 7.555 0 9.318 0 11.366 1.708 13 3.781 13h8.906C14.502 13 16 11.57 16 9.773c0-1.636-1.242-2.969-2.834-3.194C12.923 3.999 10.69 2 8 2zM5.045 8.718a.5.5 0 0 1 .71-.036L8 10.793l2.246-2.11a.5.5 0 1 1 .708.732l-2.6 2.445a.5.5 0 0 1-.708 0l-2.6-2.445a.5.5 0 0 1 .035-.71zM8 4.5a.5.5 0 0 1 .5.5v5.793a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5z"/>
                </svg>
                YT Downloader
            </a>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                
                <!-- Main Downloader Card (Green-White Blended Floating Block) -->
                <div class="ios-card text-center">
                    <h4 class="mb-2" style="font-weight: 700; color: #1b5e20;">YouTube Downloader</h4>
                    
                    <!-- Short Intro Statement in English -->
                    <p class="text-muted mb-2" style="font-size: 14px; line-height: 1.5;">
                        Convert your favorite YouTube videos to MP3 effortlessly and chill with background music even when your phone screen is off!
                    </p>

                    <!-- Telegram Contact Link -->
                    <div class="mb-4">
                        <a href="https://t.me/ZMK_112" target="_blank" class="dev-tg-link">
                            💬 Feedback & Support: Dev @ZMK_112
                        </a>
                    </div>
                    
                    <form id="downloadForm">
                        <div class="mb-3 text-start">
                            <input type="url" id="urlInput" class="form-control form-control-ios" placeholder="https://youtube.com/..." required>
                        </div>
                        <div class="mb-4 text-start">
                            <select id="formatInput" class="form-select form-select-ios" required>
                                <option value="" disabled selected>Select Format / Quality</option>
                                <option value="mp3">🎧 MP3 (Audio Only)</option>
                                <option value="360p">🎬 360p (Fast & Small)</option>
                                <option value="720p">🎬 720p (HD Quality)</option>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-ios-primary" id="downloadBtn">Start Download</button>
                    </form>
                    
                    <div id="statusMsg" class="mt-3 text-success" style="font-size: 14px; display: none; font-weight: 600;"></div>
                    <div id="errorMsg" class="mt-3 text-danger" style="font-size: 14px; display: none; font-weight: 600;"></div>
                </div>

                <div id="librarySection" style="display: none;">
                    
                    <!-- MP3 Library Section -->
                    <div id="mp3Container" style="display: none;">
                        <div class="list-section-title">🎵 Music Library (MP3)</div>
                        <div class="ios-list-group" id="mp3List"></div>
                    </div>

                    <!-- MP4 Library Section -->
                    <div id="mp4Container" style="display: none;">
                        <div class="list-section-title">🎬 Video Library (MP4)</div>
                        <div class="ios-list-group" id="mp4List"></div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic (မူရင်း Backend API ခေါ်ဆိုမှုများအတိုင်း ၁၀၀% ထိန်းသိမ်းထားပါသည်) -->
    <script>
        document.addEventListener("DOMContentLoaded", loadFiles);

        document.getElementById('downloadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('downloadBtn');
            const url = document.getElementById('urlInput').value;
            const format = document.getElementById('formatInput').value;
            const statusMsg = document.getElementById('statusMsg');
            const errorMsg = document.getElementById('errorMsg');

            btn.disabled = true;
            btn.innerHTML = '<span class="loading-pulse"></span> Downloading...';
            statusMsg.style.display = 'none';
            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url, format: format })
                });

                const data = await response.json();

                if(response.ok) {
                    statusMsg.innerText = "✅ " + data.message;
                    statusMsg.style.display = 'block';
                    document.getElementById('downloadForm').reset();
                    loadFiles();
                } else {
                    errorMsg.innerText = "❌ " + data.error;
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.innerText = "❌ Connection Error!";
                errorMsg.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Start Download';
            }
        });

        async function loadFiles() {
            try {
                const response = await fetch('/api/files');
                const data = await response.json();

                const librarySection = document.getElementById('librarySection');
                const mp3Container = document.getElementById('mp3Container');
                const mp4Container = document.getElementById('mp4Container');
                const mp3List = document.getElementById('mp3List');
                const mp4List = document.getElementById('mp4List');

                mp3List.innerHTML = '';
                mp4List.innerHTML = '';

                let hasFiles = false;

                // SVG Arrow Icon for Compact Save Button
                const svgIcon = `
                    <svg class="svg" viewBox="0 0 1024 1024" version="1.1" xmlns="http://www.w3.org/2000/svg">
                        <path d="M779.180132 473.232045 322.354755 16.406668c-21.413706-21.413706-56.121182-21.413706-77.534887 0-21.413706 21.413706-21.413706 56.122205 0 77.534887l418.057421 418.057421L244.819868 930.057421c-21.413706 21.413706-21.413706 56.122205 0 77.534887 10.706853 10.706853 24.759917 16.059767 38.767955 16.059767s28.061103-5.353938 38.767955-16.059767L779.180132 550.767955C800.593837 529.35425 800.593837 494.64575 779.180132 473.232045z"></path>
                    </svg>`;

                // Render MP3 Files with Motion Slide In Animation
                if (data.mp3 && data.mp3.length > 0) {
                    hasFiles = true;
                    mp3Container.style.display = 'block';
                    data.mp3.forEach((file, index) => {
                        const encoded = encodeURIComponent(file);
                        mp3List.innerHTML += `
                            <div class="ios-list-item" style="animation-delay: ${index * 0.1}s;">
                                <span class="fw-semibold text-truncate" style="color: #1b5e20;">${file}</span>
                                <audio controls src="/serve/${encoded}"></audio>
                                <div class="d-flex justify-content-end align-items-center mt-1 fx-layer">
                                    <a href="/serve/${encoded}?download=true" class="box start-btn">
                                        <span class="text">Save</span>
                                        <div class="btn-icon">
                                            ${svgIcon}
                                        </div>
                                        <div class="circle-overlay"></div>
                                    </a>
                                </div>
                            </div>`;
                    });
                } else {
                    mp3Container.style.display = 'none';
                }

                // Render MP4 Files with Motion Slide In Animation
                if (data.mp4 && data.mp4.length > 0) {
                    hasFiles = true;
                    mp4Container.style.display = 'block';
                    data.mp4.forEach((file, index) => {
                        const encoded = encodeURIComponent(file);
                        mp4List.innerHTML += `
                            <div class="ios-list-item" style="animation-delay: ${index * 0.1}s;">
                                <span class="fw-semibold text-truncate" style="color: #1b5e20;">${file}</span>
                                <video controls src="/serve/${encoded}"></video>
                                <div class="d-flex justify-content-end align-items-center mt-1 fx-layer">
                                    <a href="/serve/${encoded}?download=true" class="box start-btn">
                                        <span class="text">Save</span>
                                        <div class="btn-icon">
                                            ${svgIcon}
                                        </div>
                                        <div class="circle-overlay"></div>
                                    </a>
                                </div>
                            </div>`;
                    });
                } else {
                    mp4Container.style.display = 'none';
                }

                librarySection.style.display = hasFiles ? 'block' : 'none';

            } catch (err) {
                console.error("Error loading files", err);
            }
        }
    </script>
</body>
</html>
